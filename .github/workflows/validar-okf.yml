name: Validar repositorio OKF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pyyaml

      - name: Ejecutar validador (conformidad OKF)
        run: python herramientas/validar_repositorio_okf.py

      - name: Ejecutar validador ampliado (conformidad y calidad)
        run: python herramientas/validar_repositorio_okf_v2.py